
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Mi Perfil</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<header>

    <h1>AGENCIA DE BICICLETAS EL UNICORNIO AZUL</h1>

    <nav>

        <ul id="menuPrincipal">

        
        </ul>

    </nav>

</header>


<section class="perfil-container">

<div class="perfil-card">

    <div class="avatar" id="avatarUsuario"></div>

    <h2 id="saludoUsuario">
        Bienvenido
    </h2>

    <p id="correoUsuario" class="correoPerfil"></p>

    <div class="nivel-cliente">

        ⭐ Cliente Preferente

        <p>
            Gracias por confiar en nosotros.
        </p>

    </div>

    <div class="perfil-estadisticas">

        <div class="estadistica">

            <h3 id="productosCarrito">0</h3>

            <p>Productos</p>

        </div>

        <div class="estadistica">

            <h3 id="comprasRealizadas">0</h3>

            <p>Pedidos</p>

        </div>

        <div class="estadistica">

            <h3 id="favoritosUsuario">0</h3>

            <p>Favoritos</p>

        </div>

        <div class="estadistica">

            <h3 id="resenasUsuario">0</h3>

            <p>Reseñas</p>

        </div>

    </div>

    <p id="ultimoAcceso"></p>

    <form id="formContactoPerfil">
        <label for="telefonoPerfil">Teléfono de contacto</label>
        <input type="tel" id="telefonoPerfil" maxlength="30" placeholder="Ej. 4491234567">
        <button type="submit">Guardar contacto</button>
        <p id="mensajeContactoPerfil" role="status" aria-live="polite"></p>
    </form>

    <form id="formPasswordPerfil" class="formPassword">
        <h3>Cambiar contraseña</h3>
        <input type="password" id="passwordActualPerfil" placeholder="Contraseña actual" required>
        <input type="password" id="passwordNuevaPerfil" placeholder="Nueva contraseña (mínimo 8 caracteres)" minlength="8" required>
        <input type="password" id="confirmarPasswordPerfil" placeholder="Confirmar nueva contraseña" minlength="8" required>
        <button type="submit">Actualizar contraseña</button>
        <p id="mensajePasswordPerfil" role="status" aria-live="polite"></p>
    </form>

    <section class="miniChatPerfil" aria-labelledby="tituloSolicitarAyuda">
        <h3 id="tituloSolicitarAyuda">¿Necesitas hacer una consulta?</h3>
        <form id="formSolicitudCliente">
            <textarea id="consultaCliente" maxlength="2000" required placeholder="Escribe tu petición o consulta..."></textarea>
            <button type="submit">Enviar consulta</button>
        </form>
        <p id="mensajeSolicitudCliente" role="status" aria-live="polite"></p>
        <div id="misSolicitudesCliente"></div>
    </section>

    <div class="accionesPerfil">

        <a class="btn-perfil" href="historial.html">

            📦 Mis pedidos

        </a>

        <a class="btn-perfil" href="favoritos.html">

            ❤️ Favoritos

        </a>

        <a class="btn-perfil" href="comunidad.html">

            🌎 Comunidad

        </a>

        <a class="btn-perfil" href="carrito.html">

            🛒 Mi carrito

        </a>

    </div>

    <button class="btn-salir" onclick="cerrarSesion()">

        🚪 Cerrar sesión

    </button>

</div>

</section>

<script src="js/usuarios.js"></script>
<script src="js/perfil.js"></script>
<script src="js/notificaciones.js"></script>
<script src="js/notificacionesCliente.js"></script>
<script src="js/sesion.js"></script>
<script src="js/carrito.js"></script>
<script src="js/menu.js"></script>

</body>

</html>
