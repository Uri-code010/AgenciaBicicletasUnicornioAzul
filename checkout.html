<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Checkout</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<header>

    <h1>AGENCIA DE BICICLETAS EL UNICORNIO AZUL</h1>

    <nav>

        <ul>

            <li><a href="index.html">Inicio</a></li>

            <li><a href="catalogo.html">Productos</a></li>

            <li><a href="carrito.html" id="menuCarrito"> 🛒 Carrito (0)</a></li>

            <li><a href="perfil.html">Mi Perfil</a></li>

        </ul>

    </nav>

</header>

<section class="checkout-container">

    <div class="checkout-card">

        <h2>💳 Finalizar Compra</h2>

        <form id="formCheckout">

            <h2>📦 Datos de Envío</h2>

            <label>Nombre Completo</label>

            <input
                type="text"
                id="nombre"
                required>

            <label>Dirección</label>

            <input
                type="text"
                id="direccion"
                required>

            <label>Ciudad</label>

            <input
                type="text"
                id="ciudad"
                required>

            <label>Código Postal</label>

            <input
                type="text"
                id="cp"
                required>

            <label>Teléfono</label>

            <input
                type="tel"
                id="telefono"
                required>

            <hr>

            <h2>🚚 Tipo de Envío</h2>

            <label>

                <input
                    type="radio"
                    name="envio"
                    value="0"
                    checked>

                Envío Normal (Gratis)

            </label>

            <br><br>

            <label>

                <input
                    type="radio"
                    name="envio"
                    value="150">

                Envío Express (+$150)

            </label>

            <hr>

            <h2>💳 Forma de Pago</h2>

            <select id="metodoPago">

                <option value="efectivo">Efectivo</option>

                <option value="debito">Tarjeta de Débito</option>

                <option value="credito">Tarjeta de Crédito</option>

                <option value="transferencia">Transferencia Bancaria</option>

            </select>

            <div id="datosPagoDinamicos" style="margin-top:12px;"></div>

            <hr>

            <h2>🎟 Cupón de Descuento</h2>

            <input
                type="text"
                id="cupon"
                placeholder="Ejemplo: UNICORNIO10">

            <button
                type="button"
                onclick="aplicarCupon()">

                Aplicar Cupón

            </button>

            <p id="estadoCupon" style="margin-top:8px; font-weight:bold; color:#6b7280;">
                Sin cupón aplicado
            </p>

            <hr>

            <h2>🛒 Resumen del Pedido</h2>

            <div id="resumenCompra"></div>

            <h3 id="subtotalCompra"></h3>

            <h3 id="descuentoCompra"></h3>

            <h3 id="envioCompra"></h3>

            <h2 id="totalCompra"></h2>

            <hr>

            <label>

                <input
                    type="checkbox"
                    id="politica">

                Acepto la política de devoluciones.

            </label>

            <br><br>

            <label>

                <input
                    type="checkbox"
                    id="terminos">

                Acepto los términos y condiciones.

            </label>

            <br><br>

            <button type="submit">

                ✅ Confirmar Compra

            </button>

        </form>

        <div id="mensajeCompra"></div>

    </div>

</section>

<script src="js/carrito.js"></script>
<script src="js/notificaciones.js"></script>
<script src="js/checkout.js"></script>

</body>

</html>
