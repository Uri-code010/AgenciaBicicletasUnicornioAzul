<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Reportes</title>

    <link rel="stylesheet"
          href="css/estilos.css">

</head>

<body>

<div class="adminContainer">

    <aside class="menuLateral">

        <h2>Administrador</h2>

        <ul>

            <li><a href="admin.html">🏠 Dashboard</a></li>

            <li><a href="productosAdmin.html">🚲 Productos</a></li>

            <li><a href="pedidosAdmin.html">📦 Pedidos</a></li>

            <li><a href="clientesAdmin.html">👥 Clientes</a></li>

            <li><a href="promocionesAdmin.html">🏷 Promociones</a></li>

            <li>

                <a
                class="activo"
                href="reportesAdmin.html">

                    📊 Reportes

                </a>

            </li>

        </ul>

    </aside>

    <main class="contenidoAdmin">

        <header class="headerAdmin">

            <div>

                <h1>Reportes</h1>

                <p>

                    Estadísticas generales del sistema.

                </p>

            </div>

            <div class="usuarioAdmin">

                📅

                <span id="fechaActual"></span>

            </div>

        </header>

        <section class="tarjetasReportes">

            <div class="reporteCard">

                <h3>Ventas Totales</h3>

                <h2 id="ventasTotales">$0</h2>

            </div>

            <div class="reporteCard">

                <h3>Pedidos</h3>

                <h2 id="totalPedidos">0</h2>

            </div>

            <div class="reporteCard">

                <h3>Clientes</h3>

                <h2 id="totalClientes">0</h2>

            </div>

            <div class="reporteCard">

                <h3>Productos Vendidos</h3>

                <h2 id="productosVendidos">0</h2>

            </div>

        </section>

        <section class="tablaReportes">

            <h2>

                🏆 Últimos Pedidos

            </h2>

            <table class="tablaAdmin">

                <thead>

                    <tr>

                        <th>Pedido</th>

                        <th>Cliente</th>

                        <th>Total</th>

                        <th>Fecha</th>

                    </tr>

                </thead>

                <tbody id="tablaUltimosPedidos">

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="js/usuarios.js"></script>

<script src="js/reportesAdmin.js"></script>

<script>

const hoy = new Date();

document.getElementById("fechaActual").innerHTML =
hoy.toLocaleDateString(
"es-MX",
{
weekday:"long",
day:"numeric",
month:"long"
});

</script>

</body>

</html>
