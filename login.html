<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
    <body>

        <header>

            <h1>AGENCIA DE BICICLETAS EL UNICORNIO AZUL</h1>

            <nav>
                    <ul>
                        <li><a href="index.html">Inicio</a></li>
                        <li><a href="nosotros.html">Nosotros</a></li>
                        <li><a href="contacto.html">Contacto</a></li>
                        <li><a href="registro.html">Registro</a></li>
                    </ul>
                </nav>

        </header>

        <section class="login">

            <h2>Iniciar Sesión</h2>

            <form id="formLogin">

                <input type="email"
                    id="correoLogin"
                    placeholder="Correo electrónico"
                    required>

                <input type="password"
                    id="passwordLogin"
                    placeholder="Contraseña"
                    required>
                
                <div class="recordar">

                    <input
                        type="checkbox"
                        id="recordar">

                    <label for="recordar">
                        Recordar mi contraseña
                    </label>

                </div>
                <button type="submit">
                    Ingresar
                </button>

                <p class="login-link">

                    ¿Olvidaste tu contraseña?

                    <a href="recuperar.html">

                        Recuperarla

                    </a>

                </p>

                <p class="login-link">

                    ¿No tienes cuenta?

                    <a href="registro.html">

                        Regístrate

                    </a>

                </p>

            </form>
            
            <div id="mensajeLogin"></div>

            <script src="js/usuarios.js"></script>


        </section>

    </body>
</html>
