<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Carrito</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <header>

        <h1>AGENCIA DE BICICLETAS EL UNICORNIO AZUL</h1>

        <nav>

            <ul id="menuPrincipal">

            </ul>

        </nav>

    </header>

    <section class="carrito-container">

        <div class="carrito-card">

            <h2>🛒 Mi Carrito</h2>

            <div id="listaCarrito"></div>

            <hr>

            <div class="resumenPedido">

                <h3>Resumen del Pedido</h3>

                <p>
                    Subtotal:
                    <span id="subtotal">$0</span>
                </p>

                <p>
                    Envío:
                    <span>Gratis</span>
                </p>

                <p class="totalFinal">
                    Total:
                    <span id="total">$0</span>
                </p>

            </div>

            <button
                class="btn-vaciar"
                onclick="vaciarCarrito()">

                🗑 Vaciar carrito

            </button>

            <a
                href="checkout.html"
                class="boton">

                Proceder al Pago

            </a>

        </div>


    </section>

    <script>

        function mostrarCarrito(){

            const carrito = obtenerCarrito();

            const lista =
            document.getElementById("listaCarrito");

            lista.innerHTML = "";

            lista.innerHTML = "";

            if(carrito.length==0){

                lista.innerHTML = `

                    <div class="carritoVacio">

                        <h2>🛒</h2>

                        <p>

                            Tu carrito está vacío.

                        </p>

                    </div>

                `;

                document.getElementById("subtotal").innerHTML="$0";

                document.getElementById("total").innerHTML="$0";

                actualizarContadorCarrito();

                return;

            }            

            let total = 0;

            carrito.forEach((producto, indice)=>{

                const subtotal =
                producto.precio * producto.cantidad;

                total += subtotal;

                lista.innerHTML += `

                <div class="itemCarrito">

                    <img
                        src="${producto.imagen}"
                        class="imgCarrito">

                    <div class="datosCarrito">

                        <h3>${producto.nombre}</h3>

                        <p>

                            Precio:
                            $${producto.precio}

                        </p>

                        <div class="cantidad">

                            <button onclick="disminuir(${indice})">

                                -

                            </button>

                            <span>

                                ${producto.cantidad}

                            </span>

                            <button onclick="aumentar(${indice})">

                                +

                            </button>

                        </div>

                        <p>

                            Subtotal:
                            <strong>

                                $${subtotal}

                            </strong>

                        </p>

                        <button
                            class="eliminar"
                            onclick="eliminarProducto(${indice})">

                            🗑 Eliminar

                        </button>

                    </div>

                </div>

                `;

            });

            document.getElementById("subtotal").innerHTML =
            "$" + total;

            document.getElementById("total").innerHTML =
            "$" + total;

        }

        </script>

        <script src="js/carrito.js"></script>
            <script >
            mostrarCarrito();
        </script>
        
        <script src="js/notificaciones.js"></script>
        
        <script src="js/sesion.js"></script>
        <script src="js/comunidad.js"></script>
        
        <script src="js/carrito.js"></script>
        <script src="js/menu.js"></script>
    </body>


</html>
