<!DOCTYPE html>

<html lang="es">

    <head>

        <meta charset="UTF-8">

        <title>Favoritos</title>

        <link rel="stylesheet" href="css/estilos.css">

    </head>

    <body>

        <header>

            <h1>Mis Favoritos ❤️</h1>

             <nav>

                <ul  id="menuPrincipal">
                </ul>

            </nav>

        </header>

        <section class="carrito-container">

            <div class="carrito-card">

            <div id="listaFavoritos">

            </div>

            </div>

        </section>

        <script>

            const usuario =
            JSON.parse(localStorage.getItem("usuarioActual"));

            if(usuario){

            const llave =
            "favoritos_"+usuario.correo.toLowerCase();

            const favoritos =
            JSON.parse(localStorage.getItem(llave)) || [];

            const lista =
            document.getElementById("listaFavoritos");

            if(favoritos.length==0){

                lista.innerHTML="<h2>No tienes favoritos.</h2>";

            }

            else{

                favoritos.forEach(nombre=>{

                lista.innerHTML+=`

                <p>❤️ ${nombre}</p>

                `;

            });

            }

        }

        </script>

    </body>
    <script src="js/notificaciones.js"></script>

    <script src="js/sesion.js"></script>

    <script src="js/carrito.js"></script>

    <script src="js/menu.js"></script>
</html>
