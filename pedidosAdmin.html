<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">

        <title>Pedidos</title>

        <link rel="stylesheet"
        href="css/estilos.css">

    </head>

    <body>

        <div class="adminContainer">

            <aside class="menuLateral">

                <h2>Administrador</h2>

                <ul>

                <li><a href="admin.html">🏠 Dashboard</a></li>

                <li><a href="productosAdmin.html">🚲 Productos</a></li>

                <li><a href="pedidosAdmin.html">📦 Pedidos</a></li>

                <li><a href="clientesAdmin.html">👥 Clientes</a></li>

                <li><a href="promocionesAdmin.html">🏷 Promociones</a></li>

                <li><a href="reportesAdmin.html">📊 Reportes</a></li>

                </ul>

            </aside>

            <main class="contenidoAdmin">

                <header class="headerAdmin">

                <div>

                    <h1>Gestión de Pedidos</h1>

                    <p>

                        Consulta y administra los pedidos realizados por los clientes.

                    </p>

                </div>

                <div class="usuarioAdmin">

                    <span class="notificacion">

                        🔔

                    </span>

                    <span
                        class="fechaAdmin"
                        id="fechaActual">

                    </span>

                    <div class="perfilAdmin">

                        👤 Administrador

                    </div>

                </div>

            </header>
            <script src="js/pedidosAdmin.js"></script>
            <div class="barraAcciones">

                <input
                    type="text"
                    placeholder="🔍 Buscar pedido...">

                <button>

                    🔄 Actualizar

                </button>

            </div>

                <h1>Pedidos recibidos</h1>

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Cliente</th>

                            <th>Fecha</th>

                            <th>Total</th>

                            <th>Estado</th>

                            <th>Acción</th>

                        </tr>

                    </thead>

                    <tbody id="tablaPedidos">

                    </tbody>

                </table>

            </main>

        </div>

        <script>

            const hoy = new Date();

            document.getElementById("fechaActual").innerHTML =
            hoy.toLocaleDateString(
            "es-MX",
            {
            weekday:"long",
            day:"numeric",
            month:"long"
            });

        </script>
        <script src="js/notificaciones.js"></script>

    </body>

</html>
