<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>

        <h1>AGENCIA DE BICICLETAS EL UNICORNIO AZUL</h1>

        <nav>
            <ul id="menuPrincipal">
               
            </ul>
        </nav>

    </header>
    <section class="busqueda">

        <input
            type="text"
            id="buscar"
            placeholder="🔍 Buscar bicicleta...">

    </section>
    <section class="filtros-profesionales">

        <div class="grupo-filtros">
            <h3>Categoría</h3>
            <div class="botones-filtros">
                <button class="filtro-btn activo" data-grupo="categoria" data-filtro="todos" onclick="filtrarCategoria('todos')">Todas</button>
                <button class="filtro-btn" data-grupo="categoria" data-filtro="montana" onclick="filtrarCategoria('Montaña')">Montaña</button>
                <button class="filtro-btn" data-grupo="categoria" data-filtro="ruta" onclick="filtrarCategoria('Ruta')">Ruta</button>
                <button class="filtro-btn" data-grupo="categoria" data-filtro="bmx" onclick="filtrarCategoria('BMX')">BMX</button>
                <button class="filtro-btn" data-grupo="categoria" data-filtro="urbana" onclick="filtrarCategoria('Urbana')">Urbana</button>
                <button class="filtro-btn" data-grupo="categoria" data-filtro="infantil" onclick="filtrarCategoria('Infantil')">Infantil</button>
            </div>
        </div>

        <div class="grupo-filtros">
            <h3>Etiqueta</h3>
            <div class="botones-filtros">
                <button class="filtro-btn activo" data-grupo="etiqueta" data-filtro="todas" onclick="filtrarEtiqueta('todas')">Todas</button>
                <button class="filtro-btn" data-grupo="etiqueta" data-filtro="nuevo" onclick="filtrarEtiqueta('nuevo')">Nuevo</button>
                <button class="filtro-btn" data-grupo="etiqueta" data-filtro="promo" onclick="filtrarEtiqueta('promo')">Promo</button>
                <button class="filtro-btn" data-grupo="etiqueta" data-filtro="oferta" onclick="filtrarEtiqueta('oferta')">Oferta</button>
            </div>
        </div>

    </section>

<div id="contadorProductos">

    Se encontraron 8 productos

</div>

<section 
    class="catalogo"
    id="catalogo">

</section>

<div id="mensajeSinResultados" style="display:none; padding: 20px; text-align:center; color:#7f1d1d; font-weight:bold;"></div>

<script src="js/notificaciones.js"></script>

<script src="js/sesion.js"></script>

<script src="js/carrito.js"></script>

<script src="js/menu.js"></script>

</body>
</html>
