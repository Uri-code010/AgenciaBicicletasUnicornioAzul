<!DOCTYPE html>
<html lang ="es">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <link rel="stylesheet" href="css/publicidad.css">

<body>

            🔥 PROMOCIÓN DEL MES 🔥

        </button>

<audio id="campana">

</audio>
