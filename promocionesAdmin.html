<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Promociones</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<div class="adminPanel">

    <aside class="menuAdmin">

        <h2>Administrador</h2>

        <a href="admin.html">🏠 Dashboard</a>

        <a href="productosAdmin.html">🚲 Productos</a>

        <a href="pedidosAdmin.html">📦 Pedidos</a>

        <a href="promocionesAdmin.html" class="activo">

            🏷 Promociones

        </a>

        <a href="clientesAdmin.html">👥 Clientes</a>

        <a href="reportesAdmin.html">📊 Reportes</a>

    </aside>

    <main class="contenidoAdmin">

        <h1>Promociones</h1>

        <form id="formPromocion">

            <input type="hidden" id="indicePromoEditar" value="">

            <label>Nombre</label>

            <input
                type="text"
                id="nombrePromo"
                required>

            <label>Descuento (%)</label>

            <input
                type="number"
                id="descuentoPromo"
                min="1"
                max="100"
                required>

            <label>Categoría</label>

            <select id="categoriaPromo">

                <option>Nuevo</option>

                <option>Oferta</option>

                <option>Promo</option>

            </select>

            <br><br>

            <button type="submit">

                💾 Guardar Promoción

            </button>

            <button type="button" id="cancelarEdicionPromo" style="display:none; margin-left:10px;">

                ❌ Cancelar edición

            </button>

        </form>

        <hr>

        <h2>Promociones Registradas</h2>

        <table class="tablaProductos">

            <thead>

                <tr>

                    <th>Nombre</th>

                    <th>Descuento</th>

                    <th>Categoría</th>

                    <th>Acción</th>

                </tr>

            </thead>

            <tbody id="tablaPromociones">

            </tbody>

        </table>

    </main>

</div>

<script src="js/promocionesAdmin.js"></script>
<script src="js/notificaciones.js"></script>

</body>

</html>
